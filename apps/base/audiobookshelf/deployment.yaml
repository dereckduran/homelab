apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: audiobookshelf
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      securityContext:
        fsGroup: 1000 # node group
        runAsUser: 1000 # node user
        runAsGroup: 1000 # node group
      containers:
      - image: advplyr/audiobookshelf:2.37.2
        name: audiobookshelf
        envFrom:
          - configMapRef:
              name: audiobookshelf-configmap
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
          - name: abs-config
            mountPath: /config
          - name: abs-metadata
            mountPath: /metadata
          - name: abs-audiobooks
            mountPath: /app/audiobooks
          - name: abs-podcasts
            mountPath: /app/podcasts
      volumes:
        - name: abs-config
          persistentVolumeClaim:
            claimName: abs-config
        - name: abs-metadata
          persistentVolumeClaim:
            claimName: abs-metadata
        - name: abs-audiobooks
          persistentVolumeClaim:
            claimName: abs-audiobooks
        - name: abs-podcasts
          persistentVolumeClaim:
            claimName: abs-podcasts
